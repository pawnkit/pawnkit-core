name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test (race, shuffled)
        env:
          CGO_ENABLED: "1"
        run: go test -race -shuffle=on ./...

      - name: Build examples
        run: go build ./examples/...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  fuzz:
    name: fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Fuzz line index position conversion
        run: go test ./source -run=^$ -fuzz=FuzzLineIndexPosition -fuzztime=30s

      - name: Fuzz file URI round-tripping
        run: go test ./source -run=^$ -fuzz=FuzzFileURIFilename -fuzztime=30s

      - name: Fuzz edit application
        run: go test ./textedit -run=^$ -fuzz=FuzzApply -fuzztime=30s

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run benchmarks
        run: go test ./... -run=^$ -bench=. -benchmem

  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pawnkit/pawn-actions/support-check@v1.8.50
        with:
          repository: pawnkit/pawnkit-core
          targets: linux-amd64
